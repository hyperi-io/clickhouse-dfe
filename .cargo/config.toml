# Local builds fail on the same warnings CI fails on. Crates.io dependencies
# are compiled with --cap-lints allow, so this only ever bites this crate.
#
# Target rustflags join any CARGO_TARGET_<TRIPLE>_RUSTFLAGS the CI runner sets,
# which would discard `[build]` rustflags outright.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-D", "warnings"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-D", "warnings"]

# Fallback for hosts with no target section above, such as macOS.
[build]
rustflags = ["-D", "warnings"]
