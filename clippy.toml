# Wire-codec functions take a lot of small parameters.
too-many-arguments-threshold = 7

cognitive-complexity-threshold = 25

# Column decoders return deeply nested generic types.
type-complexity-threshold = 350

too-many-lines-threshold = 150

# A panic in a test IS the failure signal, so `unwrap_used` / `expect_used`
# stay deny-level for library code only.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
