# Project:   clickhouse-dfe
# File:      .hyperi-ci.yaml
# Purpose:   HyperI CI configuration
#
# License:   Apache-2.0
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Defaults: config/defaults.yaml in hyperi-ci. Override with HYPERCI_* env vars.

classification: oss

language: rust
license: Apache-2.0
quality:
  enabled: true
test:
  enabled: true
  coverage: false
  rust:
    nextest: true
build:
  enabled: true
  strategies:
  - native
  rust:
    # Every layer is a feature; the default build covers little of the crate.
    features: all
    targets: []
publish:
  enabled: true
  target: oss
