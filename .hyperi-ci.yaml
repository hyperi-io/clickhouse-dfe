#
# Defaults: config/defaults.yaml in hyperi-ci. Override with HYPERCI_* env vars.

classification: oss

language: rust
license: Apache-2.0
quality:
  enabled: true
test:
  enabled: true
  # test.min_coverage is honoured for Python only, so on Rust this reports
  # without gating and swaps nextest for cargo's harness. The floor is held by
  # cargo llvm-cov at the review gate instead.
  coverage: false
  rust:
    nextest: true
build:
  enabled: true
  strategies:
  - native
  rust:
    # Every layer is a feature; the default build covers little of the crate.
    #
    # KNOWN GAP: `-D warnings` therefore reaches only this set. The
    # feature_matrix check runs `cargo hack --each-feature --no-dev-deps
    # check`, and `check` does not fail on a warning, so feature-gated dead
    # code and feature-conditional lints pass CI. Four of them accumulated in
    # the DEFAULT set (tcp + lz4) -- the one `cargo add clickhouse-dfe`
    # compiles -- before the review gate started linting it on 2026-09-02.
    # Until hyperi-ci can lint more than one set, the review gate covers
    # default, no-default, and dynamic-only.
    features: all
    targets: []
publish:
  enabled: true
  target: oss
