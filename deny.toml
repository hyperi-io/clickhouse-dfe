[graph]
targets = []
all-features = true

[advisories]
yanked = "warn"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # webpki-roots ships the Mozilla CA bundle, which is data, not code.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# crates.io and nothing else. The empty allow-git is the enforcement point for
# the rule that upstream `clickhouse` is consumed as a published version: a
# `git =` dependency or a `[patch.crates-io]` on a fork fails this check.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
